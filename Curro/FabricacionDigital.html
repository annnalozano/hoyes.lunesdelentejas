<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Fabricación Digital”</title>
  <link rel="icon" type="image/x-icon" href="../img/dolphin_1f42c.png" />
  <style>
  
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 30px;
      gap: 10px;
    }
    .top-bar img {
      width: 70px;
      cursor: pointer;
      margin-right: auto;
    }
    .top-bar button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: transparent;
      border: 1.5px solid black;
      font-weight: normal;
      cursor: pointer;
    }

    /* Contenedor principal que agrupa texto e imagen para alinear bordes */
    #contenedor-principal {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    /* Contenedor flex para imagen + galería */
    .image-gallery-container {
      display: flex;
      gap: 20px;
      margin: 30px 0 40px 0; /* quitar auto para que no centre, estará alineado por contenedor padre */
      max-width: 100%;
      align-items: flex-start;
      padding: 0;
      box-sizing: border-box;
    }

    .main-image {
      flex: 0 0 30%;
      max-width: 30%;
    }

    .main-image img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 5px;
      border: 1px solid #ccc;
    }

    .main-image em {
      display: block;
      font-size: 0.9em;
      color: #666;
      text-align: center;
    }

    .gallery-dropdown {
      flex: 1;
      max-width: 40%;
    }

    .gallery-button {
      background-color: transparent;
      border: 1.5px solid black;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 20%;
      text-align: center;
      margin-bottom: 10px;
      user-select: none;
    }

    .gallery-content {
      display: none;
      border: 1.5px solid black;
      padding: 10px;
      background-color: #f9f9f9;
      max-height: 300px;
      overflow-y: auto;
    }

    .gallery-content img {
      width: 100%;
      max-width: 100px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
      display: block;
    }

    .gallery-content img:hover {
      border-color: black;
    }

    /* texto principal que está arriba y luego el resto abajo */
    #texto-principal {
      margin: 0 0 0 0;
      padding: 0;
    }

    #texto-secundario {
      margin: 30px 0 40px 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <img src="../gif/back111.gif" alt="Casa" onclick="window.location.href='../curro.html'">

    <button onclick="window.location.href='../Info.html'">INFO</button> 
    <button onclick="window.location.href='../index.html'">HOME</button>
  </div>

  <div id="doc">

    <div id="contenedor-principal">

      <div id="texto-principal">
        <p><strong> FABRICACIÓN DIGITAL  </strong></p>
        <p>[2024]</p>
        <p> </p>
        <p>  Archivo de Experimentos varios i trabajos de taller</p>
      </div>

   <!-- Imagen + galería en el mismo contenedor flex -->
<div class="image-gallery-container">
<div class="main-image">
  <img id="main-img" src="../img/Fabricacion/IMG_7239.jpg" alt="Gaia imagen" />
  <em id="main-caption">Biomaterial en cortadora láser.</em>
</div>


  <div class="gallery-dropdown">
    <div class="gallery-button" onclick="toggleGallery()">Galería ▼</div>
    <div class="gallery-content" id="gallery">
      <img src="../img/Fabricacion/IMG_7239.jpg" alt="Imagen 1" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption=" Soft Robotic con Biomaterial"  />

      <img src="../gif/IMG_7251-ezgif.com-video-to-gif-converter.gif" alt="Imagen 1" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption=" Soft Robotic con Biomaterial"  />

      <img src="../img/Fabricacion/IMG_7246.jpg" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Soft Robotic con Biomaterial." />
      <img src="../img/Fabricacion/IMG_7767.jpg" alt="Imagen 1" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption=" Impression 3d con barro"  />
      <img src="../gif/IMG_7465-ezgif.com-video-to-gif-converter.gif" alt="Imagen 1" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption=" Impression 3d con barro"  />

      <img src="../img/Fabricacion/IMG_7871.JPG" alt="Imagen 3" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="COcción de impresión de ceramica" />
    </div>
  </div>

</div>





        <script>
    function toggleGallery() {
      const gallery = document.getElementById('gallery');
      if (gallery.style.display === 'block') {
        gallery.style.display = 'none';
      } else {
        gallery.style.display = 'block';
      }
    }

    function changeMainImage(src, caption) {
  const mainImg = document.getElementById('main-img');
  const mainCaption = document.getElementById('main-caption');
  mainImg.src = src;
  mainCaption.textContent = caption;
}
  </script>

</body>
</html>

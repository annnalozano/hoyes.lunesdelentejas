<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Razzmatazz</title>
  <link rel="icon" type="image/x-icon" href="../img/dolphin_1f42c.png" />
  <style>
  
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 30px;
      gap: 10px;
    }
    .top-bar img {
      width: 70px;
      cursor: pointer;
      margin-right: auto;
    }
    .top-bar button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: transparent;
      border: 1.5px solid black;
      font-weight: normal;
      cursor: pointer;
    }

    /* Contenedor principal que agrupa texto e imagen para alinear bordes */
    #contenedor-principal {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    /* Contenedor flex para imagen + galería */
    .image-gallery-container {
      display: flex;
      gap: 20px;
      margin: 30px 0 40px 0; /* quitar auto para que no centre, estará alineado por contenedor padre */
      max-width: 100%;
      align-items: flex-start;
      padding: 0;
      box-sizing: border-box;
    }

    .main-image {
      flex: 0 0 30%;
      max-width: 30%;
    }

    .main-image img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 5px;
      border: 1px solid #ccc;
    }

    .main-image em {
      display: block;
      font-size: 0.9em;
      color: #666;
      text-align: center;
    }

    .gallery-dropdown {
      flex: 1;
      max-width: 40%;
    }

    .gallery-button {
      background-color: transparent;
      border: 1.5px solid black;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 20%;
      text-align: center;
      margin-bottom: 10px;
      user-select: none;
    }

    .gallery-content {
      display: none;
      border: 1.5px solid black;
      padding: 10px;
      background-color: #f9f9f9;
      max-height: 300px;
      overflow-y: auto;
    }

    .gallery-content img {
      width: 100%;
      max-width: 100px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
      display: block;
    }

    .gallery-content img:hover {
      border-color: black;
    }

    /* texto principal que está arriba y luego el resto abajo */
    #texto-principal {
      margin: 0 0 0 0;
      padding: 0;
    }

    #texto-secundario {
      margin: 30px 0 40px 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <img src="../gif/back111.gif" alt="Casa" onclick="window.location.href='../Porfolio.html'">

    <button onclick="window.location.href='../Info.html'">INFO</button> 
    <button onclick="window.location.href='../MotherOfDolphins.html'">HOME</button>
  </div>

  <div id="doc">

    <div id="contenedor-principal">

      <div id="texto-principal">
        <p><strong> 1R ANIVERSARIO HUMAN RAZZMATAZZ</strong></p>
        <p>[2023]</p>
        <p>CGI.</p>
        <p>  Proyecto colaborativo con Erques Torres. </p>
        <P> Texturización i realizacion del AR de los muñecos.</P>
      </div>

   <!-- Imagen + galería en el mismo contenedor flex -->
<div class="image-gallery-container">

  <div class="main-image">
  
      <img id="main-img" src="../img/razz/image_2022-03-08_12-49-18-1024x683.png" alt="Gaia imagen" />
   
    <em id="main-caption">Human Razzmatazz</em>
  </div>

  <div class="gallery-dropdown">
    <div class="gallery-button" onclick="toggleGallery()">Galería ▼</div>
    <div class="gallery-content" id="gallery">
      <img src="../img/razz/image_2022-03-08_12-49-18-1024x683.png" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Human Razzmatazz." />
      <img src="../img/razz/REEL_VR-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Video Resumen." />
      <img src="../img/razz/street_series2-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series4-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series5-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series6-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series7-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series8-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series9-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series10-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series11-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series12-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />
      <img src="../img/razz/street_series13-ezgif.com-video-to-gif-converter.gif" alt="Imagen 2" onclick="changeMainImage(this.src, this.dataset.caption)" data-caption="Capsulas." />


    </div>
  </div>

</div>





        <script>
    function toggleGallery() {
      const gallery = document.getElementById('gallery');
      if (gallery.style.display === 'block') {
        gallery.style.display = 'none';
      } else {
        gallery.style.display = 'block';
      }
    }

    function changeMainImage(src, caption) {
  const mainImg = document.getElementById('main-img');
  const mainCaption = document.getElementById('main-caption');
  mainImg.src = src;
  mainCaption.textContent = caption;
}
  </script>

</body>
</html>

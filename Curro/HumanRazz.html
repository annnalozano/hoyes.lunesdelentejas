    /* Contenedor flex para imagen + galería */

.main-image {

.main-image img,

      padding: 10px;

      text-align: center;
      margin-bottom: 10px;
      user-select: none;

    .gallery-content {
      display: none;
      border: 1.5px solid black;
      padding: 10px;

      max-height: 300px;
      overflow-y: auto;
    }

 .gallery-content img,

  margin-bottom: 10px;
  border: 1px solid #ccc;
  cursor: pointer;
  display: block;
  object-fit: cover;
}

.gallery-content video:hover {
  border-color: black;
}

    }

      margin: 30px 0 40px 0;
      padding: 0;
    }

/* ================================
   SCROLLBAR RETRO
   ================================ */

::-webkit-scrollbar {
  width: 22px;
  height: 22px;
}

/* FONDO DE LA BARRA */

::-webkit-scrollbar-track {
  background: #eeeeee;

  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #888888;
  border-bottom: 2px solid #888888;
}

/* PARTE QUE SE MUEVE */

::-webkit-scrollbar-thumb {
  background-color: #eeeeee;

  background-image:
    radial-gradient(#b5b5b5 1px, transparent 1px);

  background-size: 3px 3px;

  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #555555;
  border-bottom: 2px solid #555555;
}

/* AL PASAR EL RATÓN */

::-webkit-scrollbar-thumb:hover {
  background-color: #dddddd;

  background-image:
    radial-gradient(#999999 1px, transparent 1px);

  background-size: 3px 3px;
}

/* AL HACER CLICK */

::-webkit-scrollbar-thumb:active {
  background-color: #cccccc;

  border-top: 2px solid #555555;
  border-left: 2px solid #555555;
  border-right: 2px solid #ffffff;
  border-bottom: 2px solid #ffffff;
}


/* ================================
   FLECHA SUPERIOR
   ================================ */

::-webkit-scrollbar-button:single-button:vertical:decrement {
  height: 22px;

  background-color: #eeeeee;

  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #555555;
  border-bottom: 2px solid #555555;



  background-size: 7px 7px;
 background-position:
  5px 8px,
  10px 8px;
  background-repeat: no-repeat;
}


/* ================================
   FLECHA INFERIOR
   ================================ */

::-webkit-scrollbar-button:single-button:vertical:increment {
  height: 22px;

  background-color: #eeeeee;

  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #555555;
  border-bottom: 2px solid #555555;

  background-position:
    6px 7px,
    9px 7px;

  background-repeat: no-repeat;
}


/* ================================
   ESQUINA
   ================================ */

::-webkit-scrollbar-corner {
  background: #eeeeee;
}

<script>
function changeMainImage(src, caption) {
  const mainImg = document.getElementById('main-img');
  const mainCaption = document.getElementById('main-caption');
  const isVideo = /\.(mp4|webm)$/i.test(src);

  let newEl;
  if (isVideo) {
    newEl = document.createElement('video');
    newEl.autoplay = true;
    newEl.loop = true;
    newEl.muted = true;
    newEl.playsInline = true;
  } else {
    newEl = document.createElement('img');
  }

  newEl.id = 'main-img';
  newEl.className = mainImg.className; // conserva estilos/clases
  newEl.src = src;

  mainImg.replaceWith(newEl);
  mainCaption.textContent = caption;

}



 function toggleGallery() {
      const gallery = document.getElementById('gallery');
      if (gallery.style.display === 'block') {
        gallery.style.display = 'none';
      } else {
        gallery.style.display = 'block';
      }
    }
</script>
